name: FaceGuard — Signed Release APK + AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Find Gradle wrapper
        id: gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found anywhere in the repository."
            echo "Repository structure:"
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "gradlew found at: $GRADLEW"
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"
          echo "gradlew=$GRADLEW" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLEW"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore
          echo "Release keystore restored successfully."

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          GRADLEW="${{ steps.gradle.outputs.gradlew }}"

          "$GRADLEW" \
            --no-daemon \
            --stacktrace \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          GRADLEW="${{ steps.gradle.outputs.gradlew }}"

          "$GRADLEW" \
            --no-daemon \
            --stacktrace \
            bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate release artifacts
        id: artifacts
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -1)
          AAB=$(find . -type f -path "*/build/outputs/bundle/release/*.aab" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort
            exit 1
          fi

          echo "APK: $APK"
          echo "AAB: $AAB"

          mkdir -p release-artifacts

          cp "$APK" release-artifacts/FaceGuard-release.apk
          cp "$AAB" release-artifacts/FaceGuard-release.aab

          echo "apk=release-artifacts/FaceGuard-release.apk" >> "$GITHUB_OUTPUT"
          echo "aab=release-artifacts/FaceGuard-release.aab" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="${{ steps.artifacts.outputs.apk }}"

          APKSIGNER=$(find "$ANDROID_HOME" -type f -name apksigner | head -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum FaceGuard-release.apk FaceGuard-release.aab > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FaceGuard-Release
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: FaceGuard ${{ github.event.inputs.release_tag }}
          generate_release_notes: true
          files: |
            release-artifacts/FaceGuard-release.apk
            release-artifacts/FaceGuard-release.aab
            release-artifacts/SHA256SUMS.txt

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f release.keystore
